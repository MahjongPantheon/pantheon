[supervisord]
user             = root
nodaemon         = true
logfile          = /dev/stderr
logfile_maxbytes = 0
loglevel         = warn

[inet_http_server]
port     = 127.0.0.1:30017
username = user
password = 123456

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = http://127.0.0.1:30017
username  = user
password  = 123456

[program:nginx]
command         = nginx -g "daemon off;"
autostart       = true
autorestart     = true
directory       = /etc/nginx
startsecs       = 0

[program:meili_1]
command         = node server.js
environment     = PORT=41121,NODE_ENV=production
user            = user
autostart       = %(ENV_PANTHEON_PRODUCTION_WORKERS)s
autorestart     = true
directory       = /var/www/html/Meili-dist
startsecs       = 2
stopwaitsecs    = 5
stdout_logfile  = /dev/stdout
stderr_logfile  = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

