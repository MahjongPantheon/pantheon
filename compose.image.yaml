# Production artifacts from images; no application source mounts.
volumes:
  services_modules: {}
services:
  dependencies-init:
    image: ghcr.io/mahjongpantheon/pantheon-tyr-${CONTAINER_ARCH:-amd64}:${IMAGE_TAG:-latest}
    entrypoint:
    - /bin/sh
    - /var/www/html/Common/ContainerRuntime/init-dependencies.sh
    network_mode: none
    volumes:
    - services_modules:/.pnpm
    restart: 'no'
  tyr.pantheon.internal:
    env_file:
    - ./Env/${ENV_FILENAME:-.env.production}
    environment:
      PANTHEON_MODE: production
      PANTHEON_PRODUCTION_WORKERS: 'true'
      NODE_ENV: production
    healthcheck:
      test:
      - CMD
      - node
      - /var/www/html/Common/ContainerRuntime/healthcheck.mjs
      - Tyr
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      frey.pantheon.internal:
        condition: service_started
      mimir.pantheon.internal:
        condition: service_started
    volumes:
    - ./Tyr-dist/.well-known:/var/www/html/Tyr-dist/.well-known
    restart: unless-stopped
    labels:
      io.pantheon.mode: image
  forseti.pantheon.internal:
    env_file:
    - ./Env/${ENV_FILENAME:-.env.production}
    environment:
      PANTHEON_MODE: production
      PANTHEON_PRODUCTION_WORKERS: 'true'
      NODE_ENV: production
    healthcheck:
      test:
      - CMD
      - node
      - /var/www/html/Common/ContainerRuntime/healthcheck.mjs
      - Forseti
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      frey.pantheon.internal:
        condition: service_started
      mimir.pantheon.internal:
        condition: service_started
    volumes:
    - ./Forseti-dist/.well-known:/var/www/html/Forseti-dist/.well-known
    restart: unless-stopped
    labels:
      io.pantheon.mode: image
  sigrun.pantheon.internal:
    env_file:
    - ./Env/${ENV_FILENAME:-.env.production}
    environment:
      PANTHEON_MODE: production
      PANTHEON_PRODUCTION_WORKERS: 'true'
      NODE_ENV: production
      PNPM_HOME: /.pnpm
      npm_config_store_dir: /.pnpm/store
    healthcheck:
      test:
      - CMD
      - node
      - /var/www/html/Common/ContainerRuntime/healthcheck.mjs
      - Sigrun
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      dependencies-init:
        condition: service_completed_successfully
      frey.pantheon.internal:
        condition: service_started
      mimir.pantheon.internal:
        condition: service_started
    volumes:
    - services_modules:/.pnpm
    - type: volume
      source: services_modules
      target: /var/www/html/Sigrun-dist/node_modules
      volume:
        nocopy: true
        subpath: modules/Sigrun-dist
    - ./Sigrun-dist/.well-known:/var/www/html/Sigrun-dist/.well-known
    restart: unless-stopped
    labels:
      io.pantheon.mode: image
  bragi.pantheon.internal:
