upstream huginnode {
  least_conn;
  keepalive 24;
  server 127.0.0.1:41081 max_fails=3 fail_timeout=5s;
  server 127.0.0.1:41082 max_fails=3 fail_timeout=5s;
  server 127.0.0.1:41083 max_fails=3 fail_timeout=5s;
  server 127.0.0.1:41084 max_fails=3 fail_timeout=5s;
  server 127.0.0.1:41085 max_fails=3 fail_timeout=5s;
  server 127.0.0.1:41086 max_fails=3 fail_timeout=5s;
  server 127.0.0.1:41087 max_fails=3 fail_timeout=5s;
  server 127.0.0.1:41088 max_fails=3 fail_timeout=5s;
}

server {
  listen 80;
  server_name hugin.pantheon.local;
  client_max_body_size 1m;

  location / {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,X-Api-Version,X-Twirp,X-Auth-Token,X-Current-Event-Id,X-Current-Person-Id,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
      add_header 'Access-Control-Expose-Headers' 'X-Api-Version';
      add_header 'Access-Control-Max-Age' 1728000;
      add_header 'Content-Type' 'text/plain charset=UTF-8';
      add_header 'Content-Length' 0;
      return 204;
    }
    if ($request_method = 'POST') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,X-Api-Version,X-Twirp,X-Auth-Token,X-Current-Event-Id,X-Current-Person-Id,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
      add_header 'Access-Control-Expose-Headers' 'X-Api-Version';
    }
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:4008;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html/Hugin/www;
  }

  location ~ /\.ht {
    deny all;
  }

  error_page 500 502 503 504    /50x.html;
  location = /50x.html {
    root html;
  }
}


server {
  listen 80;
  server_name hugin.pantheon.internal;
  client_max_body_size 1m;

  location / {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
