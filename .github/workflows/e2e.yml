name: e2e tests

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: e2e-checks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkPr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Clear previous PR report
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/comment-checks.cjs')({
              github, context, core,
              marker: '<!-- pantheon-e2e-checks -->',
              clearPrevious: true,
            });

      - uses: NathanFirmo/wait-for-other-action@v1.0.4
        if: |
          github.ref == 'refs/heads/master' &&
          github.repository == 'MahjongPantheon/pantheon'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          workflow: 'build.yml'

      - name: Check container runtime and Compose modes
        run: bin/pantheon infra-test

      - name: Install, migrate and compile mounted sources
        id: setup
        run: |
          bin/pantheon e2e prepare
        env:
          ENV_FILENAME: .env.e2e

      - name: Check Fenrir code
        id: code_checks
        run: |
          bin/pantheon lint Fenrir || {
            cat tmp/fenrir_*.log
            exit 1
          }
        env:
          ENV_FILENAME: .env.e2e

      - name: Run all tests
        id: tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bin/pantheon bootstrap-admin
          printf '%s\n' \
            'E2E_SUPERADMIN_EMAIL=admin@localhost.localdomain' \
            'E2E_SUPERADMIN_PASSWORD=123456' > Fenrir/.env.e2e.local
          bin/pantheon e2e run
        env:
          ENV_FILENAME: .env.e2e

      - name: Prepare e2e results table
        if: ${{ !cancelled() }}
        run: bash .github/scripts/report-e2e.sh
        env:
          CHECK_RESULT: ${{ job.status }}
          SETUP_RESULT: ${{ steps.setup.outcome }}
          CODE_CHECK_RESULT: ${{ steps.code_checks.outcome }}
          E2E_RESULT: ${{ steps.tests.outcome }}

      - name: Update PR e2e results table
        if: ${{ !cancelled() && hashFiles('.ci-e2e-results/report.md') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/comment-checks.cjs')({
              github, context, core,
              reportPath: '.ci-e2e-results/report.md',
              marker: '<!-- pantheon-e2e-checks -->',
            });

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: Fenrir/playwright-report/
          retention-days: 30

      - name: Upload e2e check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-check-results
          include-hidden-files: true
          path: |
            .ci-e2e-results/
            tmp/fenrir_*.log

      - name: Stop containers
        if: always()
        run: bin/pantheon stop

