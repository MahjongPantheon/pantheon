name: Unit tests, static analysis, code style

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: service-checks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkPr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: NathanFirmo/wait-for-other-action@v1.0.4
        if: |
          github.ref == 'refs/heads/master' &&
          github.repository == 'MahjongPantheon/pantheon'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          workflow: 'build.yml'

      - name: Print env
        run: env
        env:
          ENV_FILENAME: .env.development

      - name: Pull containers
        run: make pull
        env:
          ENV_FILENAME: .env.development

      - name: Run container
        run: make pantheon_run
        env:
          ENV_FILENAME: .env.development

      - name: Install project deps
        id: deps
        run: make deps
        env:
          ENV_FILENAME: .env.development

      - name: Apply db migrations
        id: migrate
        run: make migrate
        env:
          ENV_FILENAME: .env.development

      - name: Run and report every service check
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.migrate.outcome == 'success' }}
        run: bash .github/scripts/report-checks.sh
        env:
          ENV_FILENAME: .env.development

      - name: Upload service check results
        if: ${{ !cancelled() && hashFiles('.ci-results/report.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: service-check-results
          path: .ci-results/
          include-hidden-files: true

      - name: Update PR results table
        if: ${{ !cancelled() && hashFiles('.ci-results/report.md') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/comment-checks.cjs')({ github, context, core });

      - name: Stop containers
        if: always()
        run: make pantheon_stop
        env:
          ENV_FILENAME: .env.development

