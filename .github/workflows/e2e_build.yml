name: Build container for e2e testing

on:
  workflow_dispatch:
  push:
    paths:
      - 'Fenrir/**'

permissions:
  contents: read
  packages: write

jobs:
  e2eBuildContainer:
    name: Build Fenrir (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      CONTAINER_ARCH_OVERRIDE: ${{ matrix.arch }}
    if: |
      github.ref == 'refs/heads/master' &&
      github.repository == 'MahjongPantheon/pantheon'
    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push [Fenrir]
        uses: docker/build-push-action@v6
        with:
          context: ./Fenrir
          build-args: CONTAINER_ARCH=${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mahjongpantheon/pantheon-fenrir-${{ matrix.arch }}:latest
            ghcr.io/mahjongpantheon/pantheon-fenrir-${{ matrix.arch }}:${{ github.sha }}
