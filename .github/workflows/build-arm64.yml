name: Build project artifacts & containers [arm64]

on:
  workflow_dispatch:
  push:
    paths:
      - 'Frey/**'
      - 'Mimir/**'
      - 'Hugin/**'
      - 'Gullveig/**'
      - 'Meili/**'
      - 'Hermod/**'
      - 'Skirnir/**'
      - 'Tyr/**'
      - 'Forseti/**'
      - 'Sigrun/**'
      - 'Bragi/**'
      - 'Common/**'
      - 'Database/**'
      - 'Redis/**'
      - '.github/workflows/build*.yml'
      - '.dockerignore'
      - 'docker-compose-production.yml'
      - 'Makefile'

permissions:
  contents: read
  packages: write

jobs:
  buildContainers:
    runs-on: ubuntu-latest
    env:
      CONTAINER_ARCH_OVERRIDE: arm64
    if: |
      github.ref == 'refs/heads/master' &&
      github.repository == 'MahjongPantheon/pantheon'
    steps:
      - uses: actions/checkout@v2

      - name: Check container runtime configuration
        run: |
          node --test Common/ContainerRuntime/*.test.mjs
          ENV_FILENAME=.env.e2e docker compose -f docker-compose-production.yml --env-file Env/.env.e2e config --quiet

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push [Container base]
        uses: docker/build-push-action@v6
        with:
          context: ./Common/ContainerBase
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mahjongpantheon/pantheon-container-base-v4-arm64:latest
            ghcr.io/mahjongpantheon/pantheon-container-base-v4-arm64:${{ github.sha }}

      - name: Build and push [Database]
        uses: docker/build-push-action@v6
        with:
          context: ./Database
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mahjongpantheon/pantheon-database-arm64:latest
            ghcr.io/mahjongpantheon/pantheon-database-arm64:${{ github.sha }}

      - name: Build and push [Redis]
        uses: docker/build-push-action@v6
        with:
          context: ./Redis
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mahjongpantheon/pantheon-redis-arm64:latest
            ghcr.io/mahjongpantheon/pantheon-redis-arm64:${{ github.sha }}

      - name: Build and push [Forseti]
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Forseti/Dockerfile
          platforms: linux/arm64
          build-args: CONTAINER_ARCH=arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mahjongpantheon/pantheon-forseti-arm64:latest
            ghcr.io/mahjongpantheon/pantheon-forseti-arm64:${{ github.sha }}

      - name: Build and push [Frey]
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Frey/Dockerfile
          platforms: linux/arm64
          build-args: CONTAINER_ARCH=arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mahjongpantheon/pantheon-frey-arm64:latest
            ghcr.io/mahjongpantheon/pantheon-frey-arm64:${{ github.sha }}

      - name: Build and push [Hermod]
        uses: docker/build-push-action@v6
