name: Build project artifacts & containers

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check runtime and Compose modes
        run: bin/pantheon infra-test

  base:
    needs: validate
    if: github.ref == 'refs/heads/master' && github.repository == 'MahjongPantheon/pantheon'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Common/ContainerBase
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/mahjongpantheon/pantheon-container-base-v4-${{ matrix.arch }}:latest
            ghcr.io/mahjongpantheon/pantheon-container-base-v4-${{ matrix.arch }}:${{ github.sha }}

  services:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arch: [amd64, arm64]
        service: [Tyr, Forseti, Sigrun, Bragi, Frey, Mimir, Hugin, Gullveig, Meili, Hermod, Skirnir, Database, Redis]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image and build context
        id: image
        shell: bash
        run: |
          service='${{ matrix.service }}'
          echo "name=${service,,}" >> "$GITHUB_OUTPUT"
          if [[ $service == Database || $service == Redis ]]; then
            echo "context=./$service" >> "$GITHUB_OUTPUT"
            echo 'target=' >> "$GITHUB_OUTPUT"
            echo 'application=false' >> "$GITHUB_OUTPUT"
          else
            echo 'context=.' >> "$GITHUB_OUTPUT"
            echo 'target=production' >> "$GITHUB_OUTPUT"
            echo 'application=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ matrix.service }}/Dockerfile
          target: ${{ steps.image.outputs.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CONTAINER_ARCH=${{ matrix.arch }}
            BASE_TAG=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/mahjongpantheon/pantheon-${{ steps.image.outputs.name }}-${{ matrix.arch }}:latest
            ghcr.io/mahjongpantheon/pantheon-${{ steps.image.outputs.name }}-${{ matrix.arch }}:${{ github.sha }}
      - name: Build development tooling without compiling applications
        if: steps.image.outputs.application == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          target: development
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CONTAINER_ARCH=${{ matrix.arch }}
            BASE_TAG=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/mahjongpantheon/pantheon-${{ steps.image.outputs.name }}-${{ matrix.arch }}:development
            ghcr.io/mahjongpantheon/pantheon-${{ steps.image.outputs.name }}-${{ matrix.arch }}:dev-${{ github.sha }}
