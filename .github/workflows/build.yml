name: Build project artifacts & containers

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  buildContainers:
    name: Build containers (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      CONTAINER_ARCH_OVERRIDE: ${{ matrix.arch }}
    if: |
      github.ref == 'refs/heads/master' &&
      github.repository == 'MahjongPantheon/pantheon'
    steps:
      - uses: actions/checkout@v2

      - name: Check container runtime configuration
        run: |
          node --test Common/ContainerRuntime/*.test.mjs
          ENV_FILENAME=.env.e2e docker compose -f docker-compose-production.yml --env-file Env/.env.e2e config --quiet

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push [Container base]
        uses: docker/build-push-action@v6
        with:
          context: ./Common/ContainerBase
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mahjongpantheon/pantheon-container-base-v4-${{ matrix.arch }}:latest
            ghcr.io/mahjongpantheon/pantheon-container-base-v4-${{ matrix.arch }}:${{ github.sha }}

      - name: Build and push [Database]
        uses: docker/build-push-action@v6
        with:
          context: ./Database
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mahjongpantheon/pantheon-database-${{ matrix.arch }}:latest
            ghcr.io/mahjongpantheon/pantheon-database-${{ matrix.arch }}:${{ github.sha }}

      - name: Build and push [Redis]
        uses: docker/build-push-action@v6
        with:
          context: ./Redis
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mahjongpantheon/pantheon-redis-${{ matrix.arch }}:latest
            ghcr.io/mahjongpantheon/pantheon-redis-${{ matrix.arch }}:${{ github.sha }}

      - name: Build and push [Forseti]
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: CONTAINER_ARCH=${{ matrix.arch }}
          file: Forseti/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mahjongpantheon/pantheon-forseti-${{ matrix.arch }}:latest
            ghcr.io/mahjongpantheon/pantheon-forseti-${{ matrix.arch }}:${{ github.sha }}

      - name: Build and push [Frey]
