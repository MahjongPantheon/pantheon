# Development tooling, bind mounts and container-owned watchers.
services:
  development-init:
    image: ghcr.io/mahjongpantheon/pantheon-tyr-${CONTAINER_ARCH:-amd64}:${DEV_IMAGE_TAG:-development}
    build:
      context: .
      dockerfile: Tyr/Dockerfile
      target: development
      args:
        CONTAINER_ARCH: ${CONTAINER_ARCH:-amd64}
    entrypoint:
    - /bin/sh
    - /var/www/html/Common/ContainerRuntime/development-init.sh
    volumes:
    - ./Common:/var/www/html/Common
    - pnpmstore01:/.pnpm
    restart: 'no'
  tyr.pantheon.internal:
    image: ghcr.io/mahjongpantheon/pantheon-tyr-${CONTAINER_ARCH:-amd64}:${DEV_IMAGE_TAG:-development}
    build:
      context: .
      dockerfile: Tyr/Dockerfile
      target: development
      args:
        CONTAINER_ARCH: ${CONTAINER_ARCH:-amd64}
    env_file:
    - ./Env/${ENV_FILENAME:-.env.development}
    environment:
      PANTHEON_MODE: development
      PANTHEON_PRODUCTION_WORKERS: 'false'
      PNPM_HOME: /.pnpm
      npm_config_store_dir: /.pnpm
      PANTHEON_PREPARE_DEVELOPMENT: 'true'
      PANTHEON_DEV_WATCH: 'true'
    volumes:
    - ./Tyr:/var/www/html/Tyr
    - ./Tyr-dist:/var/www/html/Tyr-dist
    - ./Common:/var/www/html/Common
    - pnpmstore01:/.pnpm
    depends_on:
      development-init:
        condition: service_completed_successfully
    labels:
      io.pantheon.mode: dev
    ports: []
    healthcheck:
      test:
      - CMD
      - node
      - /var/www/html/Common/ContainerRuntime/healthcheck.mjs
      - Tyr
      interval: 5s
      timeout: 3s
      retries: 3
  forseti.pantheon.internal:
